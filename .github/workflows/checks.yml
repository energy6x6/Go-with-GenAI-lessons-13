name: Lesson 13 checks

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.22.12'
      - name: Check module files and formatting
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(gofmt -l .)"
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
      - name: Race tests and original schema compatibility
        run: go test -race -count=1 ./...
      - name: Install pinned protoc and plugins
        run: |
          curl --fail --location --retry 3 https://github.com/protocolbuffers/protobuf/releases/download/v26.0/protoc-26.0-linux-x86_64.zip -o "$RUNNER_TEMP/protoc.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          make tools
      - name: Generated files match the schema
        run: |
          make proto
          git diff --exit-code -- gen/
      - name: Real processes, streams, REST, JWT and mTLS
        run: bash scripts/smoke.sh --evidence-dir "$RUNNER_TEMP/lesson13-smoke"
